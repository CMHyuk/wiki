<svg xmlns="http://www.w3.org/2000/svg" width="920" height="450" viewBox="0 0 920 450" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="450" fill="#ffffff"/>

  <!-- Row 1 -->
  <rect x="20" y="40" width="270" height="130" rx="10" fill="#eef4ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="155" y="68" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">① 클릭 순간, 프론트가 암호화</text>
  <text x="155" y="94" text-anchor="middle" font-size="11.5" fill="#4b5563">내 refresh token을 회사 RSA 공개키로</text>
  <text x="155" y="114" text-anchor="middle" font-size="11.5" fill="#4b5563">암호화(PKCS#1 v1.5) 후 URL-safe Base64</text>
  <text x="155" y="140" text-anchor="middle" font-size="11" fill="#4338ca">서버가 준 URL의 자리표시자를 여기서 채운다</text>

  <rect x="325" y="40" width="270" height="130" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="460" y="68" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">② session-token 진입</text>
  <text x="460" y="94" text-anchor="middle" font-size="11.5" fill="#4b5563">/sp-initiated-sso/session-token</text>
  <text x="460" y="114" text-anchor="middle" font-size="11.5" fill="#4b5563">?companyId&amp;samlClientId</text>
  <text x="460" y="134" text-anchor="middle" font-size="11.5" fill="#4b5563">&amp;spInitiatedLoginUri&amp;refreshToken</text>

  <rect x="630" y="40" width="270" height="130" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="765" y="68" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">③ 서버가 전부 되짚는다</text>
  <text x="765" y="94" text-anchor="middle" font-size="11.5" fill="#4b5563">회사 개인키로 복호화 →</text>
  <text x="765" y="114" text-anchor="middle" font-size="11.5" fill="#4b5563">토큰 저장소 조회 → 연결된 SAML 앱</text>
  <text x="765" y="134" text-anchor="middle" font-size="11.5" fill="#4b5563">확인 → 만료 검사 (하나라도 어긋나면 중단)</text>

  <line x1="292" y1="105" x2="319" y2="105" stroke="#374151" stroke-width="1.6" marker-end="url(#a4)"/>
  <line x1="597" y1="105" x2="624" y2="105" stroke="#374151" stroke-width="1.6" marker-end="url(#a4)"/>

  <!-- 연결선 (row1 → row2) -->
  <polyline points="765,172 765,200 155,200 155,238" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a4)"/>

  <!-- Row 2 -->
  <rect x="20" y="240" width="270" height="130" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="155" y="268" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">④ 격리 브라우저에 세션을 심는다</text>
  <text x="155" y="294" text-anchor="middle" font-size="11.5" fill="#4b5563">세션 쿠키 발급 + 캐시에 사용자·IP·</text>
  <text x="155" y="314" text-anchor="middle" font-size="11.5" fill="#4b5563">User-Agent·접속 지역 기록</text>
  <text x="155" y="340" text-anchor="middle" font-size="11" fill="#b45309">수명 120초 — 핸드오프 딱 그만큼</text>

  <rect x="325" y="240" width="270" height="130" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="460" y="268" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">⑤ 그제서야 SP로 보낸다</text>
  <text x="460" y="294" text-anchor="middle" font-size="11.5" fill="#4b5563">SP별 로그인 진입 URL로 이동 →</text>
  <text x="460" y="314" text-anchor="middle" font-size="11.5" fill="#4b5563">SP가 우리 IdP로 AuthnRequest 발사</text>
  <text x="460" y="340" text-anchor="middle" font-size="11" fill="#a16207">여기부터는 평범한 SP-시작 SSO</text>

  <rect x="630" y="240" width="270" height="130" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="765" y="268" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">⑥ 로그인 화면 없이 통과</text>
  <text x="765" y="294" text-anchor="middle" font-size="11.5" fill="#4b5563">SSO 필터가 ④에서 심은 세션에서</text>
  <text x="765" y="314" text-anchor="middle" font-size="11.5" fill="#4b5563">로그인된 사용자를 찾아 무화면 인증 →</text>
  <text x="765" y="334" text-anchor="middle" font-size="11.5" fill="#4b5563">Assertion 발급 → SaaS 로그인 완료</text>

  <line x1="292" y1="305" x2="319" y2="305" stroke="#374151" stroke-width="1.6" marker-end="url(#a4)"/>
  <line x1="597" y1="305" x2="624" y2="305" stroke="#374151" stroke-width="1.6" marker-end="url(#a4)"/>

  <!-- 하단 노트 -->
  <rect x="20" y="392" width="880" height="42" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="44" y="418" font-size="12" fill="#374151">핵심은 순서다. SP로 먼저 보내면 로그인 화면을 만나고, 세션을 먼저 심으면 같은 경로가 원클릭이 된다.</text>
</svg>
