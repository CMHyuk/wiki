<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="300" fill="#ffffff"/>

  <!-- 사용자 권한 전체 -->
  <rect x="40" y="40" width="300" height="86" rx="10" fill="#eef4ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="190" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">사용자가 가진 권한 전체</text>
  <text x="190" y="98" text-anchor="middle" font-size="12.5" fill="#6b7280">read · write · admin · billing · report:read …</text>

  <!-- API 필요 권한 -->
  <rect x="40" y="176" width="300" height="86" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="190" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">호출 대상 API가 요구하는 권한</text>
  <text x="190" y="234" text-anchor="middle" font-size="12.5" fill="#6b7280">report:read</text>

  <!-- 교집합 -->
  <circle cx="480" cy="151" r="56" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="480" y="146" text-anchor="middle" font-size="20" font-weight="700" fill="#b45309">∩</text>
  <text x="480" y="170" text-anchor="middle" font-size="12.5" fill="#92400e">교집합으로 축소</text>

  <!-- 발급 토큰 -->
  <rect x="620" y="108" width="260" height="86" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="750" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">발급 토큰의 권한</text>
  <text x="750" y="166" text-anchor="middle" font-size="12.5" fill="#a16207">report:read 만 포함 (나머지 제외)</text>

  <!-- 화살표 -->
  <line x1="340" y1="83" x2="432" y2="128" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <line x1="340" y1="219" x2="432" y2="174" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <line x1="536" y1="151" x2="614" y2="151" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow2)"/>
</svg>
