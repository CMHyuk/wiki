<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arwg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="440" fill="#ffffff"/>

  <!-- RBI 격리 브라우저 -->
  <rect x="20" y="30" width="270" height="380" rx="12" fill="#fafafa" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="155" y="56" text-anchor="middle" font-size="13.5" font-weight="700" fill="#374151">원격 격리 브라우저 (RBI)</text>
  <text x="155" y="75" text-anchor="middle" font-size="11.5" fill="#6b7280">쿠키도 세션도 없는 새 브라우저</text>

  <rect x="40" y="92" width="230" height="60" rx="10" fill="#eef4ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="155" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">SSO 앱 포털</text>
  <text x="155" y="136" text-anchor="middle" font-size="11.5" fill="#6b7280">사용자 콘솔의 앱 대시보드</text>

  <rect x="40" y="180" width="230" height="205" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/>
  <rect x="56" y="200" width="62" height="52" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="87" y="231" text-anchor="middle" font-size="11" fill="#374151">ChatGPT</text>
  <rect x="124" y="200" width="62" height="52" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="155" y="231" text-anchor="middle" font-size="11" fill="#374151">Claude</text>
  <rect x="192" y="200" width="62" height="52" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="223" y="231" text-anchor="middle" font-size="11" fill="#374151">Word</text>
  <rect x="56" y="264" width="62" height="52" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="87" y="295" text-anchor="middle" font-size="11" fill="#374151">Slack</text>
  <rect x="124" y="264" width="62" height="52" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="155" y="295" text-anchor="middle" font-size="11" fill="#374151">Cursor</text>
  <rect x="192" y="264" width="62" height="52" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="223" y="295" text-anchor="middle" font-size="11" fill="#374151">Notion</text>
  <text x="155" y="345" text-anchor="middle" font-size="12" font-weight="700" fill="#4338ca">타일 클릭 = 로그인 완료</text>
  <text x="155" y="366" text-anchor="middle" font-size="11.5" fill="#6b7280">아이디·비밀번호 입력 없음</text>

  <!-- 인증 서버 -->
  <rect x="345" y="70" width="240" height="120" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="465" y="98" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111827">인증 서버 (OAuth · 사용자)</text>
  <text x="465" y="122" text-anchor="middle" font-size="11.5" fill="#047857">① 앱 목록 + 실행 URL 조립</text>
  <text x="465" y="144" text-anchor="middle" font-size="11.5" fill="#047857">③ 격리 브라우저에 세션 심기</text>
  <text x="465" y="168" text-anchor="middle" font-size="11" fill="#6b7280">비밀은 URL에 넣지 않는다</text>

  <!-- SAML IdP -->
  <rect x="650" y="70" width="250" height="120" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="775" y="98" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111827">SAML IdP</text>
  <text x="775" y="122" text-anchor="middle" font-size="11.5" fill="#b45309">④ 신원 회수 → 서명된 Assertion</text>
  <text x="775" y="146" text-anchor="middle" font-size="11" fill="#92400e">SP-시작 · IdP-시작 공용 경로</text>

  <!-- SaaS -->
  <rect x="650" y="270" width="250" height="115" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="775" y="298" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111827">외부 SaaS (SP)</text>
  <text x="775" y="321" text-anchor="middle" font-size="11.5" fill="#a16207">⑤ ACS로 수신 → 로그인 처리</text>
  <text x="775" y="345" text-anchor="middle" font-size="11" fill="#6b7280">ChatGPT · Claude · Microsoft 365</text>

  <!-- 화살표 -->
  <line x1="272" y1="112" x2="339" y2="105" stroke="#374151" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="305" y="92" text-anchor="middle" font-size="11" fill="#374151">①</text>

  <line x1="272" y1="282" x2="339" y2="165" stroke="#374151" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="316" y="230" text-anchor="middle" font-size="11" fill="#374151">②·③</text>

  <line x1="585" y1="120" x2="644" y2="120" stroke="#374151" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="775" y1="190" x2="775" y2="264" stroke="#374151" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="644" y1="330" x2="296" y2="330" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arwg)"/>
  <text x="470" y="322" text-anchor="middle" font-size="11" fill="#6b7280">로그인된 SaaS 화면이 격리 브라우저에 뜬다</text>

  <!-- 범례 -->
  <text x="345" y="215" font-size="11.5" fill="#374151">② 사용자가 타일을 클릭하는 그 순간, 프론트가</text>
  <text x="345" y="234" font-size="11.5" fill="#374151">   URL의 자리표시자에 비밀값을 채워 넣는다</text>
</svg>
