<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="330" fill="#ffffff"/>

  <!-- 단계 박스 -->
  <rect x="20" y="60" width="160" height="120" rx="10" fill="#eef4ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="100" y="88" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">① 타일 클릭</text>
  <text x="100" y="112" text-anchor="middle" font-size="11" fill="#4b5563">프론트가 일회용 키</text>
  <text x="100" y="130" text-anchor="middle" font-size="11" fill="#4b5563">jwtCacheKey (UUID)</text>
  <text x="100" y="148" text-anchor="middle" font-size="11" fill="#4b5563">를 즉석에서 생성</text>

  <rect x="200" y="60" width="160" height="120" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="280" y="88" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">② prepare</text>
  <text x="280" y="112" text-anchor="middle" font-size="11" fill="#4b5563">인증 서버가 내 JWT를</text>
  <text x="280" y="130" text-anchor="middle" font-size="11" fill="#4b5563">그 키로 캐시에 보관</text>
  <text x="280" y="150" text-anchor="middle" font-size="10.5" fill="#047857">TTL = JWT 잔여 만료</text>

  <rect x="380" y="60" width="160" height="120" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="460" y="88" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">③ IdP 진입</text>
  <text x="460" y="112" text-anchor="middle" font-size="11" fill="#4b5563">/idp/initiated/login</text>
  <text x="460" y="130" text-anchor="middle" font-size="11" fill="#4b5563">?companyId&amp;samlClientId</text>
  <text x="460" y="148" text-anchor="middle" font-size="11" fill="#4b5563">&amp;jwtCacheKey</text>

  <rect x="560" y="60" width="160" height="120" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="640" y="88" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">④ 신원 회수</text>
  <text x="640" y="112" text-anchor="middle" font-size="11" fill="#4b5563">키로 JWT를 꺼내</text>
  <text x="640" y="130" text-anchor="middle" font-size="11" fill="#4b5563">회사 공개키로 서명 검증</text>
  <text x="640" y="150" text-anchor="middle" font-size="10.5" fill="#92400e">키는 그 자리에서 소진</text>

  <rect x="740" y="60" width="160" height="120" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="820" y="88" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">⑤ 발사</text>
  <text x="820" y="112" text-anchor="middle" font-size="11" fill="#4b5563">요청 없이 만든</text>
  <text x="820" y="130" text-anchor="middle" font-size="11" fill="#4b5563">서명된 Assertion을</text>
  <text x="820" y="148" text-anchor="middle" font-size="11" fill="#4b5563">SP의 ACS로 전송</text>

  <line x1="182" y1="120" x2="196" y2="120" stroke="#374151" stroke-width="1.6" marker-end="url(#a3)"/>
  <line x1="362" y1="120" x2="376" y2="120" stroke="#374151" stroke-width="1.6" marker-end="url(#a3)"/>
  <line x1="542" y1="120" x2="556" y2="120" stroke="#374151" stroke-width="1.6" marker-end="url(#a3)"/>
  <line x1="722" y1="120" x2="736" y2="120" stroke="#374151" stroke-width="1.6" marker-end="url(#a3)"/>

  <!-- 하단 노트 -->
  <rect x="20" y="215" width="880" height="86" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="44" y="245" font-size="12.5" font-weight="700" fill="#111827">주소창에 실리는 건 신원이 아니라 신원을 가리키는 포인터</text>
  <text x="44" y="270" font-size="11.5" fill="#4b5563">JWT를 URL 파라미터로 실으면 주소창·리퍼러·프록시 로그·브라우저 히스토리에 신원 전체가 남는다. 대신 일회용 키만 싣고</text>
  <text x="44" y="290" font-size="11.5" fill="#4b5563">실제 JWT는 서버 사이 공유 캐시로만 오간다. 키의 수명은 JWT의 남은 수명과 같아서, 토큰이 죽으면 링크도 같이 죽는다.</text>
</svg>
